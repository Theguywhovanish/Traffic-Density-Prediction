[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pems04-density-demo"
version = "0.4.0"
description = "Week 4 PEMS04 traffic-density forecasting and live CLI replay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2", "joblib>=1.3"]

[project.scripts]
pems04-demo = "traffic_density.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
